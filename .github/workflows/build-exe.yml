name: ساخت نسخه ویندوز (exe)

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths: ['electron/**', 'electron-builder.yml', '.github/workflows/build-exe.yml']

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: نصب وابستگی‌ها
        run: npm install --no-audit --no-fund

      - name: تولید کلاینت Prisma
        run: npx prisma generate

      - name: ساخت Next.js (standalone)
        run: npx next build

      - name: آماده‌سازی سرور مستقل برای بسته‌بندی
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force .next/static .next/standalone/.next/static
          Copy-Item -Recurse -Force public .next/standalone/public
          New-Item -ItemType Directory -Force build | Out-Null
          if (Test-Path build/app-server) { Remove-Item -Recurse -Force build/app-server }
          Copy-Item -Recurse -Force .next/standalone build/app-server
          Copy-Item -Recurse -Force db build/app-server/db

      - name: ساخت exe قابل‌حمل با Electron Builder
        run: npx electron-builder --win portable --config electron-builder.yml

      - name: بارگذاری آرتیفکت exe
        uses: actions/upload-artifact@v4
        with:
          name: defa-museum-portable-exe
          path: dist-exe/*.exe
          if-no-files-found: error

      - name: پیوست exe به Release (فقط تگ)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-exe/*.exe
