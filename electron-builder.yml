appId: ir.defa.museum
productName: defa-museum
copyright: یادواره شهدای دفاع مقدس — پروژه پژوهشی-آموزشی

directories:
  output: dist-exe
  buildResources: build

files:
  - electron/**/*

# ماژول‌های نیتیو برای پوسته لازم نیستند (سرور مستقل از قبل بسته‌بندی شده است)؛
# rebuild نیتیو نیازمند Visual Studio است و در CI شکست می‌خورد.
npmRebuild: false
buildDependenciesFromSource: false

extraResources:
  - from: build/app-server
    to: app-server

win:
  target:
    - target: portable
      arch: [x64]

portable:
  artifactName: defa-museum-${version}-portable.exe

compression: maximum
